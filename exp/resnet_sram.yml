data:
  project_name: "AnalogAI"
  architecture: "resnet18"
  dataset: "cifar10"
  n_classes: 10
  
training: 
  optimizer: "Adam"
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0005
  momentum: 0.000000001
  epochs: 100
  warmup: 1000
  beta1: 0.9
  amsgrad: false
  eps: 0.00000001
  grad_clip: 1.0
  use_fl: false

recovery:
  sram:
    use: true
    load_fp_checkpoint: true
    fp_checkpoint_path: "./save_model/basic/resnet18/0_client_resnet18_round_98_93.330000.pth.tar"
    intensity: 0.25
    parallelism: 128
  noise: 
    act_inject:
      use: false
      type: "Gaussian" # "uniform"
      mean: 1.0
      sigma: 0.0
      mask: None
      add: false
      mul: True
    weight_inject: 
      use: false
      type: "Gaussian" # "uniform"
      mean: 1.0
      sigma: 0.1
      add: false
      mul: True
      level: 0.1

  optimizer: 
    sam: false
    adaptive: false # ASAM
  adversarial: 
    FGSM: 
      use: false  
      epsilon: 0.03
    PGD: 
      use: false 
      epsilon: 0.03
      num_steps: 10
      alpha: 0.01
  qat: 
    use: false
    a_bits: 8
    w_bits: 8
