data:
  project_name: "AnalogAI"
  architecture: "vit"
  dataset: "cifar10"
  n_classes: 10
  
training: 
  optimizer: "Adam"
  batch_size: 128
  lr: 0.0003
  weight_decay: 5e-5
  momentum: 0.000000001
  epochs: 200
  warmup: 1000
  beta1: 0.9
  amsgrad: false
  eps: 0.00000001
  grad_clip: 1.0
  use_fl: false


recovery:
  sram:
    use: true
    load_fp_checkpoint: true
    fp_checkpoint_path: "./save_model/basic/vit/0_client_vit_round_85_80.520000.pth.tar"
    intensity: 0.25
    parallelism: 128
  noise: 
    act_inject:
      use: false
      type: "Gaussian" # "uniform"
      mean: 1.0
      sigma: 0.0
      mask: None
      add: false
      mul: True
    weight_inject: 
      use: false
      type: "Gaussian" # "uniform"
      mean: 1.0
      sigma: 0.1
      add: false
      mul: True
      level: 0.1

  optimizer: 
    sam: false
    adaptive: true # ASAM
  adversarial: 
    FGSM: 
      use: true  
      epsilon: 0.03
    PGD: 
      use: false 
      epsilon: 0.03
      num_steps: 10
      alpha: 0.01
  qat: 
    use: false
    a_bits: 8
    w_bits: 8
